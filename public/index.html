<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>tonight!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="TMPlogo.png">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="前の画面に戻る">←</button>
    <div class="header-main"><div class="brand-mini">tonight!</div><h1 id="pageTitle">イベント一覧</h1></div>
    <button id="eventHomeBtn" class="event-home-btn hidden" aria-label="イベントホームに戻る">⌂ <span>イベントホーム</span></button>
    <span id="sync" class="sync-state"></span>
  </header>
  <section id="eventPulse" class="event-pulse hidden" aria-live="polite">
    <div class="event-pulse-top"><span class="event-pulse-title">NOW / NEXT</span><span class="event-pulse-hint">20秒ごとに更新</span></div>
    <div id="globalNowBox"></div>
  </section>
  <main id="app"></main>
  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
